# 提交设置
minimum_pre_commit_version: 4.6.2
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

# 排除范围
exclude: >-
  (?x)(
    ^build/|
    (^|/)(\.cache|\.local|\.venv|__pycache__|node_modules)/
  )

repos:
  # 提交检查
  - repo: local
    hooks:
      - id: no-test-scripts
        name: Forbid test scripts
        entry: Test scripts must not be committed to this repository.
        language: fail
        files: '(?i)(?:^|/)(?:tests?|__tests__)/|(?:^|/)(?:test(?:[-_][^/]+)?|[^/]+[-_.](?:test|spec))\.(?:sh|bash|zsh|py|[cm]?jsx?|tsx?)$'

      - id: project-check
        name: Project changed-file formatting, syntax and static checks
        entry: make check
        language: system
        files: ^(?:Makefile$|\.pre-commit-config\.yaml$|(?:wsley|scripts)/)
        pass_filenames: false
        require_serial: true

  # 文件检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        name: Check added large files
        args: [--maxkb=1024]
      - id: fix-byte-order-marker
        name: Remove byte order marks
      - id: check-case-conflict
        name: Check case conflicts
      - id: check-executables-have-shebangs
        name: Check executable shebangs
      - id: check-merge-conflict
        name: Check merge conflicts
        args: [--assume-in-merge]
      - id: check-symlinks
        name: Check symlink targets
      - id: check-yaml
        name: Check YAML syntax
      - id: detect-private-key
        name: Detect private keys
      - id: destroyed-symlinks
        name: Detect destroyed symlinks
      - id: end-of-file-fixer
        name: Fix final newlines
      - id: forbid-submodules
        name: Forbid submodules
      - id: mixed-line-ending
        name: Check line endings
        args: [--fix=no]
        exclude_types: [binary]
      - id: trailing-whitespace
        name: Trim trailing whitespace
        args: [--markdown-linebreak-ext=md]

  # 提交信息检查
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.2
    hooks:
      - id: commitizen
        name: Check commit message
        stages: [commit-msg]
