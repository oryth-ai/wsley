minimum_pre_commit_version: 4.6.2
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: fix-byte-order-marker
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: detect-private-key
      - id: destroyed-symlinks
      - id: end-of-file-fixer
      - id: forbid-submodules
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: local
    hooks:
      - id: no-test-scripts
        name: Forbid test scripts
        entry: Test scripts must not be committed to this repository.
        language: fail
        files: '(?i)(?:^|/)(?:tests?|__tests__)/|(?:^|/)(?:test(?:[-_][^/]+)?|[^/]+[-_.](?:test|spec))\.(?:sh|bash|zsh|py|[cm]?jsx?|tsx?)$'
      - id: shell-format
        name: Format Bash scripts
        entry: make format
        language: system
        files: ^(?:Makefile$|(?:wsley|scripts)/.*\.sh$)
        pass_filenames: false
      - id: project-check
        name: Check project sources and modules
        entry: make check
        language: system
        files: ^(?:Makefile$|\.pre-commit-config\.yaml$|(?:wsley|scripts)/)
        pass_filenames: false

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen
        stages: [commit-msg]
